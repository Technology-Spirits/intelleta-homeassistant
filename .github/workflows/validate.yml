name: Validate

# ⛔ THREE GATES, AND THE FIRST TWO ARE NOT OURS.
#
# hassfest is Home Assistant's own manifest validator and hacs is the
# installer's. They enforce rules that change when THEIR projects change, not
# when ours does — which is why this also runs weekly on a schedule. A gate
# that only runs when we push tells us nothing about the drift that happens
# while we are not looking.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master, 2026-09-12

  hacs:
    name: Installer validation
    runs-on: ubuntu-latest
    # ⛔⛔ SKIPPED WHILE THIS REPOSITORY IS PRIVATE, AND IT TURNS ITSELF ON.
    #
    # The installer's validator does not read the checked-out files — it fetches
    # the repository through GitHub's public API. On a private repository it can
    # read nothing, and reports that as two CONTENT errors:
    #
    #   <Validation hacsjson> failed: The repository has an invalid 'hacs.json'
    #   <Validation integration_manifest> failed: expected a dictionary. Got None
    #
    # Both files are fine. Measured 2026-08-26 by reducing hacs.json to the
    # documented minimum, {"name": "..."}, and watching it fail identically.
    #
    # ⚠ THE POINT OF THE CONDITION RATHER THAN DELETING THE JOB: the owner ruled
    # private while we build, public at launch (2026-08-25). A gate left red
    # until then is a gate people learn to click past — this programme has
    # already written that lesson down once. This one is quiet while it cannot
    # work and starts enforcing by itself the day the repository goes public,
    # with nobody needing to remember. See cards 87 and 96.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # ⚠ The logo lives in Home Assistant's own brands project and is
          # reviewed by their maintainers on their timetable (card 94). Until
          # that lands this check would fail for a reason we cannot fix by
          # pushing, so it is ignored HERE and tracked THERE.
          ignore: brands

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run
        run: pytest tests/ -v
